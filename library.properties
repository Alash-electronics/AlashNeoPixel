sentence=WS2812 / NeoPixel LED strips with ready effects, HSV, gradient, gamma and a current limiter. Own driver for AVR 16 MHz, ESP8266 and ESP32, no dependencies.
paragraph=Drives WS2812, WS2812B and SK6812 (RGB and RGBW) addressable LEDs: AlashNeoPixel strip(30, 6); strip.fill(AlashNeoPixel::RED); strip.show(). Colors by HSV, color wheel, rainbow, gradient, fade, rotate, gamma correction, global brightness that keeps the pixel data, and setMaxMilliamps() that protects the power supply. Ten ready effects without delay(): rainbow, chase, comet, breathe, blink, twinkle, fire, wipe, theater, scanner. Writes the signal itself (AVR at 16 MHz, ESP8266, ESP32 with core 3.x RMT), setWriter() lets other boards plug in an output. Explains problems in Russian, Kazakh or English. Examples included, made for classes and kits by Alash Electronics.
